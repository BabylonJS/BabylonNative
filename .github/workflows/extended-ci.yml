name: Extended CI

# Slow or runner-scarce jobs that are not worth blocking every PR on. They run against master once a
# day and can be started on demand from the Actions tab (Run workflow) to check a branch.
# Not to be confused with the root nightly.yml, the Azure pipeline that validates against Babylon.js nightly.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  # ── Sanitizers ────────────────────────────────────────────────
  MacOS_Sanitizers:
    uses: ./.github/workflows/build-macos.yml
    with:
      enable-sanitizers: true
      xcode-version: "26.4"
      runs-on: macos-26

  Win32_x64_D3D11_Sanitizers:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: V8
      enable-sanitizers: true

  # ── Android on macOS hosts (the Ubuntu-hosted Android builds stay in ci.yml) ──
  Android_MacOS_JSC:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: macos-26
      js-engine: JavaScriptCore

  Android_MacOS_V8:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: macos-26
      js-engine: V8

  Android_MacOS_QuickJS:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: macos-26
      js-engine: QuickJS
