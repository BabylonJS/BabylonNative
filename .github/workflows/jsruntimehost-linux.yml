name: JsRuntimeHost Linux unit tests

on:
  workflow_call:
    inputs:
      cc:
        type: string
        required: true
      cxx:
        type: string
        required: true
      js-engine:
        type: string
        required: true

env:
  npm_config_fetch_retries: '5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: ${{ inputs.cc }}
      CXX: ${{ inputs.cxx }}
      JS_ENGINE: ${{ inputs.js-engine }}
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libjavascriptcoregtk-4.1-dev libcurl4-openssl-dev ninja-build clang xvfb xauth

      - name: Configure JsRuntimeHost
        run: |
          cmake -S Dependencies/JsRuntimeHost -B build/JsRuntimeHost -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DNAPI_JAVASCRIPT_ENGINE="$JS_ENGINE" \
            -DJAVASCRIPTCORE_LIBRARY=/usr/lib/x86_64-linux-gnu/libjavascriptcoregtk-4.1.so \
            -DJSRUNTIMEHOST_TESTS=ON -DBABYLON_DEBUG_TRACE=ON

      - name: Build UnitTests
        run: cmake --build build/JsRuntimeHost --target UnitTests --parallel

      - name: Enable core dumps
        run: sudo sysctl -w kernel.core_pattern=core.%p

      - name: Run UnitTests
        working-directory: build/JsRuntimeHost/Tests/UnitTests
        run: |
          ulimit -c unlimited
          xvfb-run --auto-servernum ./UnitTests

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: JsRuntimeHost-Linux-${{ inputs.cc }}-${{ inputs.js-engine }}-core-dumps
          path: |
            build/JsRuntimeHost/Tests/UnitTests/UnitTests
            build/JsRuntimeHost/Tests/UnitTests/core.*
          if-no-files-found: ignore
