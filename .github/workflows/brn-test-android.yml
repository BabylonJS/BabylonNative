name: BRN Test Android Package
on: workflow_call
jobs:
  build-test-android:
    runs-on: macos-15
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4.2.2
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: BabylonReactNative
        path: Embedding/ReactNative/artifact
    - name: Install build package
      run: |
        package=$(find ../../artifact -maxdepth 1 -name 'babylonjs-react-native-*.tgz' -print -quit)
        test -n "$package"
        npm install "$package"
        npm install
      working-directory: Embedding/ReactNative/Apps/Playground
    - name: Gulp (Android)
      run: |
        npm install
        npx gulp buildAndroid
      working-directory: Embedding/ReactNative/Package
    timeout-minutes: 90
permissions:
  contents: read
