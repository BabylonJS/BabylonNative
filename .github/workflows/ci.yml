name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede in-flight PR runs when a new commit is pushed. Pushes to master are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hermes, sanitizer, and macOS-hosted Android builds run in the Azure pipeline nightly.yml.
jobs:
  runtime-source-changes:
    runs-on: ubuntu-latest
    outputs:
      jsruntimehost: ${{ steps.diff.outputs.jsruntimehost }}
      urllib: ${{ steps.diff.outputs.urllib }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check component changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            printf 'jsruntimehost=true\nurllib=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          for component in JsRuntimeHost UrlLib; do
            case "$component" in
              JsRuntimeHost) output=jsruntimehost ;;
              UrlLib) output=urllib ;;
            esac
            if git diff --quiet "$base" "$PR_HEAD" -- "Dependencies/$component" ".github/actions/$output"; then
              echo "$output=false" >> "$GITHUB_OUTPUT"
            else
              result=$?
              if [ "$result" -ne 1 ]; then
                exit "$result"
              fi
              echo "$output=true" >> "$GITHUB_OUTPUT"
            fi
          done

  # ── Apple: macOS ──────────────────────────────────────────────
  MacOS:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-macos.yml
    with:
      xcode-version: "26.4"
      runs-on: macos-26
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  MacOS_Ninja:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-macos.yml
    with:
      generator: "Ninja Multi-Config"
      xcode-version: "26.4"
      runs-on: macos-26
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  # ── Apple: iOS ───────────────────────────────────────────────
  iOS_Xcode26:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-ios.yml
    with:
      deployment-target: "26.0"
      xcode-version: "26.4"
      runs-on: macos-26
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}

  MacOS_QuickJS:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-macos.yml
    with:
      xcode-version: "26.4"
      runs-on: macos-26
      js-engine: QuickJS
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  # ── Win32─────────────────────────────────────────────────────
  Win32_x64_D3D11:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Win32_x64_JSI_D3D11:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: jsi
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Win32_x64_V8_D3D11:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: V8
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Win32_x64_QuickJS_D3D11:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: QuickJS
      graphics-api: D3D11
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Win32_x64_D3D12:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      graphics-api: D3D12
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Win32_x64_D3D11_PrecompiledShaderTest:
    uses: ./.github/workflows/build-win32-shader.yml

  # ── UWP ───────────────────────────────────────────────────────
  UWP_x64:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: x64

  UWP_arm64:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: arm64

  UWP_arm64_JSI:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: arm64
      napi-type: jsi

  # ── Ubuntu / Linux ────────────────────────────────────────────
  Ubuntu_Clang_JSC:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: JavaScriptCore
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Ubuntu_GCC_JSC:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: gcc
      cxx: g++
      js-engine: JavaScriptCore
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  Ubuntu_Clang_QuickJS:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: QuickJS
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  # Exercise Vulkan validation, unit, and module-load coverage using lavapipe
  # under Xvfb.
  Ubuntu_Clang_Vulkan:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: JavaScriptCore
      graphics-api: Vulkan
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}
      run-urllib-tests: ${{ needs.runtime-source-changes.outputs.urllib == 'true' }}

  # ── Android ───────────────────────────────────────────────────
  Android_Ubuntu_JSC:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: JavaScriptCore
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}

  Android_Ubuntu_V8:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: V8
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}

  Android_Ubuntu_QuickJS:
    needs: runtime-source-changes
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: QuickJS
      run-jsruntimehost-tests: ${{ needs.runtime-source-changes.outputs.jsruntimehost == 'true' }}

  # ── Installation Tests ────────────────────────────────────────
  iOS_Installation:
    uses: ./.github/workflows/test-install-ios.yml
    with:
      deployment-target: "17.2"

  Linux_Installation:
    uses: ./.github/workflows/test-install-linux.yml

  MacOS_Installation:
    uses: ./.github/workflows/test-install-macos.yml

  Win32_Installation:
    uses: ./.github/workflows/test-install-win32.yml

  ci-complete:
    name: ci-complete
    # Run after unsuccessful dependencies too, so they cannot skip the required check.
    if: always()
    needs:
      - runtime-source-changes
      - MacOS
      - MacOS_Ninja
      - iOS_Xcode26
      - MacOS_QuickJS
      - Win32_x64_D3D11
      - Win32_x64_JSI_D3D11
      - Win32_x64_V8_D3D11
      - Win32_x64_QuickJS_D3D11
      - Win32_x64_D3D12
      - Win32_x64_D3D11_PrecompiledShaderTest
      - UWP_x64
      - UWP_arm64
      - UWP_arm64_JSI
      - Ubuntu_Clang_JSC
      - Ubuntu_GCC_JSC
      - Ubuntu_Clang_QuickJS
      - Ubuntu_Clang_Vulkan
      - Android_Ubuntu_JSC
      - Android_Ubuntu_V8
      - Android_Ubuntu_QuickJS
      - iOS_Installation
      - Linux_Installation
      - MacOS_Installation
      - Win32_Installation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::CI did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
