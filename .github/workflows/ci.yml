name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede in-flight PR runs when a new commit is pushed. Pushes to master are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hermes, sanitizer, and macOS-hosted Android builds run in the Azure pipeline nightly.yml.
jobs:
  runtime-source-changes:
    runs-on: ubuntu-latest
    outputs:
      jsruntimehost: ${{ steps.diff.outputs.jsruntimehost }}
      urllib: ${{ steps.diff.outputs.urllib }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check component changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            printf 'jsruntimehost=true\nurllib=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          for component in JsRuntimeHost UrlLib; do
            case "$component" in
              JsRuntimeHost) output=jsruntimehost ;;
              UrlLib) output=urllib ;;
            esac
            if git diff --quiet "$base" "$PR_HEAD" -- "Dependencies/$component" ":(glob).github/workflows/$output-*.yml"; then
              echo "$output=false" >> "$GITHUB_OUTPUT"
            else
              result=$?
              if [ "$result" -ne 1 ]; then
                exit "$result"
              fi
              echo "$output=true" >> "$GITHUB_OUTPUT"
            fi
          done

  # ── Apple: macOS ──────────────────────────────────────────────
  MacOS:
    uses: ./.github/workflows/build-macos.yml
    with:
      xcode-version: "26.4"
      runs-on: macos-26

  MacOS_Ninja:
    uses: ./.github/workflows/build-macos.yml
    with:
      generator: "Ninja Multi-Config"
      xcode-version: "26.4"
      runs-on: macos-26

  # ── Apple: iOS ───────────────────────────────────────────────
  iOS_Xcode26:
    uses: ./.github/workflows/build-ios.yml
    with:
      deployment-target: "26.0"
      xcode-version: "26.4"
      runs-on: macos-26

  MacOS_QuickJS:
    uses: ./.github/workflows/build-macos.yml
    with:
      xcode-version: "26.4"
      runs-on: macos-26
      js-engine: QuickJS

  # ── Win32─────────────────────────────────────────────────────
  Win32_x64_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64

  Win32_x64_JSI_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: jsi

  Win32_x64_V8_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: V8

  Win32_x64_QuickJS_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: QuickJS
      graphics-api: D3D11

  Win32_x64_D3D12:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      graphics-api: D3D12

  Win32_x64_D3D11_PrecompiledShaderTest:
    uses: ./.github/workflows/build-win32-shader.yml

  # ── UWP ───────────────────────────────────────────────────────
  UWP_x64:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: x64

  UWP_arm64:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: arm64

  UWP_arm64_JSI:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: arm64
      napi-type: jsi

  # ── Ubuntu / Linux ────────────────────────────────────────────
  Ubuntu_Clang_JSC:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: JavaScriptCore

  Ubuntu_GCC_JSC:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: gcc
      cxx: g++
      js-engine: JavaScriptCore

  Ubuntu_Clang_QuickJS:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: QuickJS

  # Exercise Vulkan validation, unit, and module-load coverage using lavapipe
  # under Xvfb.
  Ubuntu_Clang_Vulkan:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: JavaScriptCore
      graphics-api: Vulkan

  # ── Android ───────────────────────────────────────────────────
  Android_Ubuntu_JSC:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: JavaScriptCore

  Android_Ubuntu_V8:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: V8

  Android_Ubuntu_QuickJS:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: QuickJS

  # Component suites use independent runners after the platform builds succeed.
  JsRuntimeHost_Win32:
    needs: [runtime-source-changes, Win32_x64_D3D11, Win32_x64_JSI_D3D11, Win32_x64_V8_D3D11, Win32_x64_QuickJS_D3D11]
    if: needs.runtime-source-changes.outputs.jsruntimehost == 'true'
    strategy:
      fail-fast: false
      matrix:
        js-engine: [Chakra, JSI, V8, QuickJS]
    uses: ./.github/workflows/jsruntimehost-win32.yml
    with:
      js-engine: ${{ matrix.js-engine }}

  UrlLib_Win32:
    needs: [runtime-source-changes, Win32_x64_D3D11]
    if: needs.runtime-source-changes.outputs.urllib == 'true'
    uses: ./.github/workflows/urllib-win32.yml

  JsRuntimeHost_Linux:
    needs: [runtime-source-changes, Ubuntu_Clang_JSC, Ubuntu_GCC_JSC, Ubuntu_Clang_QuickJS]
    if: needs.runtime-source-changes.outputs.jsruntimehost == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: clang
            cxx: clang++
            js-engine: JavaScriptCore
          - cc: gcc
            cxx: g++
            js-engine: JavaScriptCore
          - cc: clang
            cxx: clang++
            js-engine: QuickJS
    uses: ./.github/workflows/jsruntimehost-linux.yml
    with:
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      js-engine: ${{ matrix.js-engine }}

  UrlLib_Linux:
    needs: [runtime-source-changes, Ubuntu_Clang_JSC, Ubuntu_GCC_JSC]
    if: needs.runtime-source-changes.outputs.urllib == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: clang
            cxx: clang++
          - cc: gcc
            cxx: g++
    uses: ./.github/workflows/urllib-linux.yml
    with:
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}

  JsRuntimeHost_MacOS:
    needs: [runtime-source-changes, MacOS, MacOS_Ninja, MacOS_QuickJS]
    if: needs.runtime-source-changes.outputs.jsruntimehost == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - generator: Xcode
            js-engine: JavaScriptCore
          - generator: Ninja Multi-Config
            js-engine: JavaScriptCore
          - generator: Xcode
            js-engine: QuickJS
    uses: ./.github/workflows/jsruntimehost-macos.yml
    with:
      generator: ${{ matrix.generator }}
      js-engine: ${{ matrix.js-engine }}

  UrlLib_MacOS:
    needs: [runtime-source-changes, MacOS, MacOS_Ninja]
    if: needs.runtime-source-changes.outputs.urllib == 'true'
    strategy:
      fail-fast: false
      matrix:
        generator: [Xcode, Ninja Multi-Config]
    uses: ./.github/workflows/urllib-macos.yml
    with:
      generator: ${{ matrix.generator }}

  JsRuntimeHost_Android:
    needs: [runtime-source-changes, Android_Ubuntu_JSC, Android_Ubuntu_V8, Android_Ubuntu_QuickJS]
    if: needs.runtime-source-changes.outputs.jsruntimehost == 'true'
    strategy:
      fail-fast: false
      matrix:
        js-engine: [JavaScriptCore, V8, QuickJS]
    uses: ./.github/workflows/jsruntimehost-android.yml
    with:
      js-engine: ${{ matrix.js-engine }}

  JsRuntimeHost_iOS:
    needs: [runtime-source-changes, iOS_Xcode26]
    if: needs.runtime-source-changes.outputs.jsruntimehost == 'true'
    uses: ./.github/workflows/jsruntimehost-ios.yml
    with:
      deployment-target: "26.0"

  # ── Installation Tests ────────────────────────────────────────
  iOS_Installation:
    uses: ./.github/workflows/test-install-ios.yml
    with:
      deployment-target: "17.2"

  Linux_Installation:
    uses: ./.github/workflows/test-install-linux.yml

  MacOS_Installation:
    uses: ./.github/workflows/test-install-macos.yml

  Win32_Installation:
    uses: ./.github/workflows/test-install-win32.yml

  ci-complete:
    name: ci-complete
    # Run after unsuccessful dependencies too, so they cannot skip the required check.
    if: always()
    needs:
      - runtime-source-changes
      - MacOS
      - MacOS_Ninja
      - iOS_Xcode26
      - MacOS_QuickJS
      - Win32_x64_D3D11
      - Win32_x64_JSI_D3D11
      - Win32_x64_V8_D3D11
      - Win32_x64_QuickJS_D3D11
      - Win32_x64_D3D12
      - Win32_x64_D3D11_PrecompiledShaderTest
      - UWP_x64
      - UWP_arm64
      - UWP_arm64_JSI
      - Ubuntu_Clang_JSC
      - Ubuntu_GCC_JSC
      - Ubuntu_Clang_QuickJS
      - Ubuntu_Clang_Vulkan
      - Android_Ubuntu_JSC
      - Android_Ubuntu_V8
      - Android_Ubuntu_QuickJS
      - JsRuntimeHost_Win32
      - UrlLib_Win32
      - JsRuntimeHost_Linux
      - UrlLib_Linux
      - JsRuntimeHost_MacOS
      - UrlLib_MacOS
      - JsRuntimeHost_Android
      - JsRuntimeHost_iOS
      - iOS_Installation
      - Linux_Installation
      - MacOS_Installation
      - Win32_Installation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          outputs = needs["runtime-source-changes"]["outputs"]
          failed = []
          for name, job in needs.items():
              component = (
                  "jsruntimehost" if name.startswith("JsRuntimeHost_") else
                  "urllib" if name.startswith("UrlLib_") else None
              )
              expected = "success"
              if component and outputs.get(component) == "false":
                  expected = "skipped"
              if job["result"] != expected:
                  failed.append(f"{name}: {job['result']} (expected {expected})")
          if failed:
              raise SystemExit("CI did not succeed: " + "; ".join(failed))
          print("All required jobs passed; only unchanged component suites were skipped.")
          PY
