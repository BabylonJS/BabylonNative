name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Supersede in-flight PR runs when a new commit is pushed. Pushes to master are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Hermes and macOS-hosted Android builds run in the Azure pipeline nightly.yml; sanitizer builds run
# in the Azure pipeline nightly-extended.yml.
jobs:
  component-path-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jsruntimehost: ${{ steps.paths.outputs.jsruntimehost }}
      urllib: ${{ steps.paths.outputs.urllib }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Filter component paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            printf 'jsruntimehost=true\nurllib=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$PR_BASE" "$PR_HEAD")
          for component in JsRuntimeHost UrlLib; do
            case "$component" in
              JsRuntimeHost) output=jsruntimehost ;;
              UrlLib) output=urllib ;;
            esac
            if git diff --quiet "$base" "$PR_HEAD" -- \
              "Dependencies/$component" \
              Dependencies/CMakeExtensions \
              .github/workflows/ci.yml \
              ":(glob).github/workflows/$output-*.yml"; then
              echo "$output=false" >> "$GITHUB_OUTPUT"
            else
              result=$?
              if [ "$result" -ne 1 ]; then
                exit "$result"
              fi
              echo "$output=true" >> "$GITHUB_OUTPUT"
            fi
          done

  # ── Apple: macOS ──────────────────────────────────────────────
  MacOS:
    uses: ./.github/workflows/build-macos.yml
    with:
      xcode-version: "26.4"
      runs-on: macos-26

  MacOS_Ninja:
    uses: ./.github/workflows/build-macos.yml
    with:
      generator: "Ninja Multi-Config"
      xcode-version: "26.4"
      runs-on: macos-26

  # ── Apple: iOS ───────────────────────────────────────────────
  iOS_Xcode26:
    uses: ./.github/workflows/build-ios.yml
    with:
      deployment-target: "26.0"
      xcode-version: "26.4"
      runs-on: macos-26

  MacOS_QuickJS:
    uses: ./.github/workflows/build-macos.yml
    with:
      xcode-version: "26.4"
      runs-on: macos-26
      js-engine: QuickJS

  # ── Win32─────────────────────────────────────────────────────
  Win32_x64_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64

  Win32_x64_JSI_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: jsi

  Win32_x64_V8_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: V8

  Win32_x64_QuickJS_D3D11:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      napi-type: QuickJS
      graphics-api: D3D11

  Win32_x64_D3D12:
    uses: ./.github/workflows/build-win32.yml
    with:
      platform: x64
      graphics-api: D3D12

  Win32_x64_D3D11_PrecompiledShaderTest:
    uses: ./.github/workflows/build-win32-shader.yml

  # ── UWP ───────────────────────────────────────────────────────
  UWP_x64:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: x64

  UWP_arm64:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: arm64

  UWP_arm64_JSI:
    uses: ./.github/workflows/build-uwp.yml
    with:
      platform: arm64
      napi-type: jsi

  # ── Ubuntu / Linux ────────────────────────────────────────────
  Ubuntu_Clang_JSC:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: JavaScriptCore

  Ubuntu_GCC_JSC:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: gcc
      cxx: g++
      js-engine: JavaScriptCore

  Ubuntu_Clang_QuickJS:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: QuickJS

  # Exercise Vulkan validation, unit, and module-load coverage using lavapipe
  # under Xvfb.
  Ubuntu_Clang_Vulkan:
    uses: ./.github/workflows/build-linux.yml
    with:
      cc: clang
      cxx: clang++
      js-engine: JavaScriptCore
      graphics-api: Vulkan

  # ── Android ───────────────────────────────────────────────────
  Android_Ubuntu_JSC:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: JavaScriptCore

  Android_Ubuntu_V8:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: V8

  Android_Ubuntu_QuickJS:
    uses: ./.github/workflows/build-android.yml
    with:
      runs-on: ubuntu-latest
      js-engine: QuickJS

  jsruntimehost:
    if: needs.component-path-filter.outputs.jsruntimehost == 'true'
    needs:
      - component-path-filter
      - Win32_x64_D3D11
      - Win32_x64_JSI_D3D11
      - Win32_x64_V8_D3D11
      - Win32_x64_QuickJS_D3D11
      - Ubuntu_Clang_JSC
      - Ubuntu_GCC_JSC
      - Ubuntu_Clang_QuickJS
      - MacOS
      - MacOS_Ninja
      - MacOS_QuickJS
      - Android_Ubuntu_JSC
      - Android_Ubuntu_V8
      - Android_Ubuntu_QuickJS
      - iOS_Xcode26
    uses: ./.github/workflows/jsruntimehost-ci.yml

  urllib:
    if: needs.component-path-filter.outputs.urllib == 'true'
    needs: [component-path-filter, Win32_x64_D3D11, Ubuntu_Clang_JSC, Ubuntu_GCC_JSC, MacOS, MacOS_Ninja]
    uses: ./.github/workflows/urllib-ci.yml

  jsruntimehost-ci-complete:
    if: always()
    needs: [component-path-filter, jsruntimehost]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify JsRuntimeHost jobs succeeded
        env:
          FILTER_RESULT: ${{ needs.component-path-filter.result }}
          CHANGED: ${{ needs.component-path-filter.outputs.jsruntimehost }}
          RESULT: ${{ needs.jsruntimehost.result }}
        run: |
          if [ "$FILTER_RESULT" != success ]; then
            echo "::error::Component path filtering did not succeed."
            exit 1
          fi
          case "$CHANGED:$RESULT" in
            true:success) echo "JsRuntimeHost tests passed." ;;
            false:skipped) echo "JsRuntimeHost is unchanged; tests intentionally skipped." ;;
            *) echo "::error::Unexpected JsRuntimeHost result: changed=$CHANGED, result=$RESULT"; exit 1 ;;
          esac

  urllib-ci-complete:
    if: always()
    needs: [component-path-filter, urllib]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify UrlLib jobs succeeded
        env:
          FILTER_RESULT: ${{ needs.component-path-filter.result }}
          CHANGED: ${{ needs.component-path-filter.outputs.urllib }}
          RESULT: ${{ needs.urllib.result }}
        run: |
          if [ "$FILTER_RESULT" != success ]; then
            echo "::error::Component path filtering did not succeed."
            exit 1
          fi
          case "$CHANGED:$RESULT" in
            true:success) echo "UrlLib tests passed." ;;
            false:skipped) echo "UrlLib is unchanged; tests intentionally skipped." ;;
            *) echo "::error::Unexpected UrlLib result: changed=$CHANGED, result=$RESULT"; exit 1 ;;
          esac

  # ── Installation Tests ────────────────────────────────────────
  iOS_Installation:
    uses: ./.github/workflows/test-install-ios.yml
    with:
      deployment-target: "17.2"

  Linux_Installation:
    uses: ./.github/workflows/test-install-linux.yml

  MacOS_Installation:
    uses: ./.github/workflows/test-install-macos.yml

  Win32_Installation:
    uses: ./.github/workflows/test-install-win32.yml

  ci-complete:
    name: ci-complete
    # Run after unsuccessful dependencies too, so they cannot skip the required check.
    if: always()
    needs:
      - component-path-filter
      - MacOS
      - MacOS_Ninja
      - iOS_Xcode26
      - MacOS_QuickJS
      - Win32_x64_D3D11
      - Win32_x64_JSI_D3D11
      - Win32_x64_V8_D3D11
      - Win32_x64_QuickJS_D3D11
      - Win32_x64_D3D12
      - Win32_x64_D3D11_PrecompiledShaderTest
      - UWP_x64
      - UWP_arm64
      - UWP_arm64_JSI
      - Ubuntu_Clang_JSC
      - Ubuntu_GCC_JSC
      - Ubuntu_Clang_QuickJS
      - Ubuntu_Clang_Vulkan
      - Android_Ubuntu_JSC
      - Android_Ubuntu_V8
      - Android_Ubuntu_QuickJS
      - jsruntimehost
      - urllib
      - jsruntimehost-ci-complete
      - urllib-ci-complete
      - iOS_Installation
      - Linux_Installation
      - MacOS_Installation
      - Win32_Installation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          outputs = needs["component-path-filter"]["outputs"]
          components = ("jsruntimehost", "urllib")
          if any(outputs.get(name) not in ("true", "false") for name in components):
              raise SystemExit("Component path filter did not provide valid outputs.")
          failed = [
              f"{name}: {job['result']}"
              for name, job in needs.items()
              if job["result"] != (
                  "skipped" if name in components and outputs[name] == "false" else "success"
              )
          ]
          if failed:
              raise SystemExit("CI did not succeed: " + "; ".join(failed))
          print("All required jobs passed; only unchanged component suites were skipped.")
          PY
