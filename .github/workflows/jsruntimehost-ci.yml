name: JsRuntimeHost CI

on:
  workflow_call:

jobs:
  Android:
    strategy:
      fail-fast: false
      matrix:
        js-engine: [JavaScriptCore, V8, QuickJS]
    uses: ./.github/workflows/build-mobile-tests.yml
    with:
      component: JsRuntimeHost
      platform: Android
      js-engine: ${{ matrix.js-engine }}

  iOS:
    uses: ./.github/workflows/build-mobile-tests.yml
    with:
      component: JsRuntimeHost
      platform: iOS
