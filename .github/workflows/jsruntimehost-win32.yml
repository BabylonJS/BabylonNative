name: JsRuntimeHost Windows unit tests

on:
  workflow_call:
    inputs:
      js-engine:
        type: string
        required: true

env:
  npm_config_fetch_retries: '5'

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Configure JsRuntimeHost
        shell: pwsh
        env:
          JS_ENGINE: ${{ inputs.js-engine }}
        run: |
          cmake -S Dependencies/JsRuntimeHost -B build/JsRuntimeHost -G "Visual Studio 17 2022" -A x64 `
            "-DNAPI_JAVASCRIPT_ENGINE=$env:JS_ENGINE" `
            -DJSRUNTIMEHOST_TESTS=ON -DBABYLON_DEBUG_TRACE=ON

      - name: Build UnitTests
        run: cmake --build build/JsRuntimeHost --config RelWithDebInfo --target UnitTests --parallel

      - name: Enable crash dumps
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpCount /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\UnitTests.exe" /v DumpFolder /t REG_SZ /d "%RUNNER_TEMP%\Dumps" /f

      - name: Run UnitTests
        working-directory: build/JsRuntimeHost/Tests/UnitTests/RelWithDebInfo
        run: .\UnitTests.exe

      - name: Stage crash dump binaries
        if: failure()
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\Dumps" | Out-Null
          Copy-Item -Path "build\JsRuntimeHost\Tests\UnitTests\RelWithDebInfo\UnitTests.*" -Destination "$env:RUNNER_TEMP\Dumps\" -ErrorAction SilentlyContinue

      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: JsRuntimeHost-Windows-${{ inputs.js-engine }}-crash-dumps
          path: ${{ runner.temp }}/Dumps/
          if-no-files-found: ignore
