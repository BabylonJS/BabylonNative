name: Build iOS

on:
  workflow_call:
    inputs:
      deployment-target:
        required: true
        type: string
      xcode-version:
        required: false
        type: string
        default: '16.4'
      runs-on:
        required: false
        type: string
        default: macos-latest
      nativewebgpu:
        required: false
        type: boolean
        default: false

# Absorb transient npm registry / CDN flakes during `npm install` in Apps/CMakeLists.txt.
# npm's default fetch-retries is 2; bump to 5 (npm's own exponential backoff handles spacing).
env:
  npm_config_fetch_retries: '5'

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5


      - name: Select Xcode ${{ inputs.xcode-version }}
        run: sudo xcode-select --switch /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer

      - name: Generate iOS solution
        if: ${{ !inputs.nativewebgpu }}
        run: |
          cmake -G Xcode -B build/iOS \
            -D IOS=ON \
            -D DEPLOYMENT_TARGET=${{ inputs.deployment-target }} \
            -D BABYLON_DEBUG_TRACE=ON \
            -D BABYLON_NATIVE_PLUGIN_NATIVEDRACO=ON \
            -D BABYLON_NATIVE_PLUGIN_NATIVEMESHOPT=ON \
            -D CMAKE_IOS_INSTALL_COMBINED=NO

      - name: Build Playground iOS
        if: ${{ !inputs.nativewebgpu }}
        run: |
          xcodebuild \
            -project build/iOS/BabylonNative.xcodeproj \
            -scheme Playground \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      # NativeWebGPU (WebGPU/Dawn, Metal backend) build. The iOS Playground host
      # has no Dawn code path, so build the NativeWebGPU plugin target (plugin + Dawn) to validate it
      # compiles/links.
      - name: Generate iOS solution (NativeWebGPU)
        if: ${{ inputs.nativewebgpu }}
        run: |
          cmake -G Xcode -B build/iOS \
            -D IOS=ON \
            -D DEPLOYMENT_TARGET=${{ inputs.deployment-target }} \
            -D BABYLON_DEBUG_TRACE=ON \
            -D CMAKE_IOS_INSTALL_COMBINED=NO \
            -D BABYLON_NATIVE_PLUGIN_NATIVEWEBGPU=ON

      - name: Build NativeWebGPU iOS
        if: ${{ inputs.nativewebgpu }}
        run: |
          xcodebuild \
            -project build/iOS/BabylonNative.xcodeproj \
            -scheme NativeWebGPU \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
      - name: Build unit-test artifacts
        uses: ./.github/actions/build-mobile-tests
        with:
          component: JsRuntimeHost
          platform: iOS
          deployment-target: ${{ inputs.deployment-target }}
