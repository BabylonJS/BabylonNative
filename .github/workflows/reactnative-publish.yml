name: React Native Publish Package
on:
  release:
    types:
    - published
jobs:
  build-typescript:
    uses: ./.github/workflows/reactnative-typescript.yml
    if: ${{ startsWith(github.event.release.tag_name, 'react-native/v') }}
  package:
    needs:
    - build-typescript
    uses: ./.github/workflows/reactnative-package.yml
    if: ${{ startsWith(github.event.release.tag_name, 'react-native/v') }}
  publish:
    runs-on: macos-15
    needs:
    - package
    steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: https://registry.npmjs.org
    - name: Download Assembled Folder
      uses: actions/download-artifact@v4
      with:
        name: Assembled
        path: Embedding/ReactNative/Package/Assembled
    - name: Diagnose NPM Registry Connectivity
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        echo "--- Node & NPM versions ---"
        node --version
        npm --version
        echo "--- NPM config registry ---"
        npm config get registry
        echo "--- NPM ping ---"
        npm ping
        echo "--- NPM whoami ---"
        npm whoami
    - name: Version & Publish Package
      run: |
        version="${RELEASE_TAG#react-native/v}"
        npm version --no-git-tag-version "$version"
        npm publish --access public
      working-directory: Embedding/ReactNative/Package/Assembled
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    if: ${{ startsWith(github.event.release.tag_name, 'react-native/v') }}
permissions:
  contents: read
