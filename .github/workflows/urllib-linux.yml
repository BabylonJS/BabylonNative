name: UrlLib Linux unit tests

on:
  workflow_call:
    inputs:
      cc:
        type: string
        required: true
      cxx:
        type: string
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CC: ${{ inputs.cc }}
      CXX: ${{ inputs.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev ninja-build clang

      - name: Configure UrlLib
        run: cmake -S Dependencies/UrlLib -B build/UrlLib -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DURLLIB_TESTS=ON

      - name: Build UrlLibTests
        run: cmake --build build/UrlLib --target UrlLibTests --parallel

      - name: Run UrlLibTests
        run: build/UrlLib/Tests/UrlLibTests
