name: Build Android

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      js-engine:
        required: true
        type: string
      run-jsruntimehost-tests:
        required: false
        type: boolean
        default: false

env:
  NDK_VERSION: '28.2.13676358'
  # Absorb transient npm registry / CDN flakes during `npm install` in Apps/CMakeLists.txt.
  # npm's default fetch-retries is 2; bump to 5 (npm's own exponential backoff handles spacing).
  npm_config_fetch_retries: '5'

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.run-jsruntimehost-tests && 120 || 45 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Playground ${{ inputs.js-engine }}
        working-directory: Apps/Playground/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PjsEngine=${{ inputs.js-engine }} \
            -PARM64Only \
            -PNDK_VERSION=${{ env.NDK_VERSION }} \
            -PBABYLON_NATIVE_PLUGIN_NATIVEDRACO=ON \
            -PBABYLON_NATIVE_PLUGIN_NATIVEMESHOPT=ON \
            -PSANITIZERS=OFF

      - name: Run JsRuntimeHost Android emulator tests
        if: inputs.run-jsruntimehost-tests
        uses: ./.github/actions/jsruntimehost/android
        with:
          js-engine: ${{ inputs.js-engine }}
          ndk-version: ${{ env.NDK_VERSION }}
