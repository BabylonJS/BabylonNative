name: Build Android

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      js-engine:
        required: true
        type: string

env:
  NDK_VERSION: '28.2.13676358'
  # Absorb transient npm registry / CDN flakes during `npm install` in Apps/CMakeLists.txt.
  # npm's default fetch-retries is 2; bump to 5 (npm's own exponential backoff handles spacing).
  npm_config_fetch_retries: '5'

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5


      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja (Hermes host-compiler bootstrap)
        if: inputs.js-engine == 'Hermes'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          elif [ "${{ runner.os }}" = "macOS" ] && ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi

      - name: Install ccache
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ccache
          elif [ "${{ runner.os }}" = "macOS" ] && ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      # Compiler cache. PRs only restore (they can read the cache saved by master pushes);
      # only master pushes save, so PR runs don't churn the repository cache quota.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ runner.os }}-${{ inputs.js-engine }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ inputs.js-engine }}-

      - name: Build Playground ${{ inputs.js-engine }}
        working-directory: Apps/Playground/Android
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 500M
          # Gradle's CMake picks these up as the default CMAKE_<LANG>_COMPILER_LAUNCHER.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ccache --zero-stats
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PjsEngine=${{ inputs.js-engine }} \
            -PARM64Only \
            -PNDK_VERSION=${{ env.NDK_VERSION }} \
            -PBABYLON_NATIVE_PLUGIN_NATIVEDRACO=ON \
            -PBABYLON_NATIVE_PLUGIN_NATIVEMESHOPT=ON \
            -PSANITIZERS=OFF
          ccache --show-stats

      - name: Save ccache
        if: ${{ github.event_name == 'push' && success() }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
