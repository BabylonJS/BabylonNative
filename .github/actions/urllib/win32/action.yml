name: UrlLib Windows unit tests
description: Build and run UrlLib unit tests in a configured Windows build.
inputs:
  build-directory:
    description: Configured BabylonNative CMake build directory.
    required: true
runs:
  using: composite
  steps:
    - name: Build UrlLibTests
      shell: pwsh
      env:
        BUILD_DIRECTORY: ${{ inputs.build-directory }}
      run: cmake --build "$env:BUILD_DIRECTORY" --config RelWithDebInfo --target UrlLibTests --parallel
    - name: Run UrlLibTests
      shell: pwsh
      env:
        BUILD_DIRECTORY: ${{ inputs.build-directory }}
      run: |
        Set-Location "$env:BUILD_DIRECTORY\Dependencies\UrlLib\Tests\RelWithDebInfo"
        & .\UrlLibTests.exe
