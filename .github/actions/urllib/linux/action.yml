name: UrlLib Linux unit tests
description: Build and run UrlLib unit tests in a configured Linux build.
inputs:
  build-directory:
    description: Configured BabylonNative CMake build directory.
    required: true
runs:
  using: composite
  steps:
    - name: Build UrlLibTests
      shell: bash
      env:
        BUILD_DIRECTORY: ${{ inputs.build-directory }}
      run: cmake --build "$BUILD_DIRECTORY" --target UrlLibTests --parallel
    - name: Run UrlLibTests
      shell: bash
      env:
        BUILD_DIRECTORY: ${{ inputs.build-directory }}
      run: '"$BUILD_DIRECTORY/Dependencies/UrlLib/Tests/UrlLibTests"'
